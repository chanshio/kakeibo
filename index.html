<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿スキャナー">
<title>家計簿スキャナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F6F2EC;
    --surface: #FFFDF9;
    --ink: #1E1810;
    --ink2: #6B5E52;
    --ink3: #A89888;
    --border: #E4DACE;
    --border2: #D0C4B4;
    --accent: #3B6EA5;
    --accent-bg: #EAF1FA;
    --accent-text: #1A4A7A;
    --danger: #C0392B;
    --danger-bg: #FDECEA;
    --success: #27714A;
    --success-bg: #E8F5EE;
    --radius: 12px;
    --radius-sm: 8px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }

  /* ── Screen wrapper ── */
  .screen { display: flex; flex-direction: column; flex: 1; padding-bottom: env(safe-area-inset-bottom, 16px); }
  .screen.center { align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }

  /* ── Top bar ── */
  .top-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .top-bar .title { flex: 1; font-size: 15px; font-weight: 500; text-align: center; }
  .top-bar .app-name { flex: 1; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .top-bar .badge { font-size: 12px; color: var(--ink3); }

  .icon-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    background: transparent; cursor: pointer; font-size: 18px; color: var(--ink2);
    transition: background .15s;
  }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn:active { transform: scale(.95); }

  /* ── Setup screen ── */
  .setup-body { padding: 28px 20px; }
  .logo-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
  .logo-icon { font-size: 52px; color: var(--accent); }
  .setup-title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; letter-spacing: -.02em; }
  .setup-sub { font-size: 13px; color: var(--ink2); text-align: center; line-height: 1.7; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink2); margin-bottom: 6px; letter-spacing: .03em; }
  .field input {
    width: 100%; padding: 11px 14px; font-size: 14px;
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    transition: border-color .15s;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,110,165,.15); }
  .field-hint { font-size: 11px; color: var(--ink3); margin-top: 5px; line-height: 1.6; }
  .field-hint a { color: var(--accent); text-decoration: none; }
  .field-hint a:hover { text-decoration: underline; }
  .err-msg { font-size: 12px; color: var(--danger); margin-top: 8px; display: flex; align-items: center; gap: 4px; }

  /* ── Buttons ── */
  .btn-primary {
    width: 100%; padding: 14px; font-size: 15px; font-weight: 500;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: 'Noto Sans JP', sans-serif;
    transition: opacity .15s, transform .1s;
  }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }

  /* ── Home screen ── */
  .scan-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 24px; }
  .scan-btn {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 100%; max-width: 240px; padding: 36px 24px;
    background: var(--surface); border: 1.5px dashed var(--border2);
    border-radius: var(--radius); cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .scan-btn:hover { background: var(--accent-bg); border-color: var(--accent); }
  .scan-btn:active { transform: scale(.97); }
  .scan-btn .s-icon { font-size: 52px; color: var(--accent); }
  .scan-btn .s-label { font-size: 15px; font-weight: 500; }
  .scan-btn .s-sub { font-size: 12px; color: var(--ink3); }

  .stats-card {
    margin: 0 20px 20px; padding: 14px 18px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); display: flex; align-items: baseline; gap: 6px;
  }
  .stats-num { font-size: 26px; font-weight: 700; color: var(--ink); }
  .stats-lbl { font-size: 13px; color: var(--ink2); }

  .gemini-tag {
    text-align: center; font-size: 11px; color: var(--ink3);
    padding-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 4px;
  }

  .err-banner {
    margin: 0 20px 12px; padding: 10px 14px;
    background: var(--danger-bg); color: var(--danger);
    border-radius: var(--radius-sm); font-size: 13px;
    display: flex; align-items: flex-start; gap: 6px; line-height: 1.5;
  }

  /* ── Processing ── */
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(.88); } }
  .proc-icon { font-size: 60px; color: var(--accent); animation: pulse 1.5s ease-in-out infinite; margin-bottom: 20px; }
  .proc-txt { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
  .proc-sub { font-size: 13px; color: var(--ink2); }

  /* ── Review screen ── */
  .entries-list { padding: 0 14px; display: flex; flex-direction: column; gap: 10px; }

  .entry-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .entry-head { display: flex; align-items: center; gap: 8px; }
  .entry-head input[type="date"] {
    flex: 1; font-size: 12px; color: var(--ink2);
    border: none; background: transparent; font-family: 'Noto Sans JP', sans-serif;
  }
  .del-btn {
    width: 28px; height: 28px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; cursor: pointer;
    color: var(--danger); font-size: 16px; border-radius: 6px;
    transition: background .15s;
  }
  .del-btn:hover { background: var(--danger-bg); }

  .name-inp {
    font-size: 15px; font-weight: 500;
    border: none; border-bottom: 1px solid var(--border2);
    padding: 4px 0; width: 100%;
    background: transparent; color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
  }
  .name-inp:focus { outline: none; border-color: var(--accent); }

  .amt-row { display: flex; align-items: center; gap: 4px; }
  .yen-sign { font-size: 15px; color: var(--ink2); font-weight: 500; }
  .amt-inp {
    font-size: 20px; font-weight: 700;
    border: none; border-bottom: 1px solid var(--border2);
    flex: 1; background: transparent; color: var(--ink);
    font-family: monospace; min-width: 0;
  }
  .amt-inp:focus { outline: none; border-color: var(--accent); }

  .cat-sel {
    font-size: 13px; width: 100%;
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    padding: 7px 10px; background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
  }
  .cat-sel:focus { outline: none; border-color: var(--accent); }

  .notes-inp {
    font-size: 12px; color: var(--ink2);
    border: none; border-bottom: 1px dotted var(--border);
    width: 100%; background: transparent; padding: 3px 0;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .notes-inp:focus { outline: none; }
  .notes-inp::placeholder { color: var(--ink3); }

  .add-entry-btn {
    margin: 10px 14px 0; padding: 12px;
    width: calc(100% - 28px);
    border: 1.5px dashed var(--border2); border-radius: var(--radius-sm);
    background: transparent; cursor: pointer;
    font-size: 13px; color: var(--ink2);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: 'Noto Sans JP', sans-serif;
    transition: background .15s;
  }
  .add-entry-btn:hover { background: var(--bg); }

  .submit-footer {
    margin: 16px 14px 0;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; font-size: 13px; color: var(--ink2); }
  .total-amt { font-size: 22px; font-weight: 700; color: var(--ink); font-family: monospace; }

  /* ── Success ── */
  @keyframes popIn { 0% { transform:scale(.3); opacity:0; } 70% { transform:scale(1.15); } 100% { transform:scale(1); opacity:1; } }
  .ok-icon { font-size: 72px; color: var(--success); animation: popIn .5s ease-out both; margin-bottom: 20px; }
  .ok-txt { font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: -.02em; }
  .ok-sub { font-size: 14px; color: var(--ink2); margin-bottom: 32px; }
  .sheet-link {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 14px; font-size: 13px; color: var(--accent); text-decoration: none;
  }
  .sheet-link:hover { text-decoration: underline; }

  input::placeholder { color: var(--ink3); }
</style>
</head>
<body>

<div id="app"></div>
<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" aria-label="レシート画像を選択">

<script>
const CP = ["P_食費","P_雑費","P_自分メンテ","P_特別費","P_予備費","P_固定費","P_家具・インテリア","P_お出かけ"];
const CB = ["B_サブスク","B_攻めの投資","B_ガソリン","B_その他"];

const SYS = `あなたは家計簿入力アシスタントです。レシート画像から支出データを抽出し、JSON形式のみで返してください（マークダウン記号不要）。

カテゴリ一覧:
P_食費(食料品・外食), P_雑費(日用品・雑貨), P_自分メンテ(美容・健康), P_特別費(特別な外食・ギフト),
P_予備費(その他個人), P_固定費(光熱費・通信費), P_家具・インテリア(家具購入), P_お出かけ(駐車・交通・レジャー),
B_サブスク(Adobe等サブスク), B_攻めの投資(機材・書籍), B_ガソリン(仕事用給油), B_その他(その他事業経費)

仕事関係はB_カテゴリを選択。日付不明なら今日の日付を使用。

出力形式（このJSONのみ返すこと）:
{"entries":[{"date":"YYYY/MM/DD","name":"店舗名","amount":数値,"category":"カテゴリ","notes":"備考または空文字"}]}`;

// ── State & Storage (localStorage) ──────────────────────────────────────────
let S = { screen:'loading', geminiKey:'', scriptUrl:'', entries:[], sent:0, lastN:0, err:'' };

function load(key, fallback='') {
  try { return localStorage.getItem(key) || fallback; } catch { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, val); } catch {}
}

function init() {
  S.geminiKey = load('kb_gkey');
  S.scriptUrl = load('kb_url');
  S.sent = parseInt(load('kb_cnt', '0')) || 0;
  S.screen = (S.geminiKey && S.scriptUrl) ? 'home' : 'setup';
  render();
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function td() {
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function toDI(s) { return (s||td()).replace(/\//g,'-'); }
function frDI(s) { return s.replace(/-/g,'/'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n) { return Number(n||0).toLocaleString('ja-JP'); }

// ── Main render ───────────────────────────────────────────────────────────────
const app = document.getElementById('app');
const fi  = document.getElementById('fileInput');

function render() {
  const s = S.screen;
  if      (s === 'loading')    renderLoading();
  else if (s === 'setup')      renderSetup();
  else if (s === 'home')       renderHome();
  else if (s === 'processing') renderProcessing();
  else if (s === 'review')     renderReview();
  else if (s === 'success')    renderSuccess();
}

function renderLoading() {
  app.innerHTML = `<div class="screen center">
    <div class="proc-icon"><i class="ti ti-receipt-2"></i></div>
  </div>`;
}

function renderSetup() {
  app.innerHTML = `<div class="screen">
    <div class="setup-body">
      <div class="logo-wrap"><i class="ti ti-receipt-2 logo-icon"></i></div>
      <h1 class="setup-title">家計簿スキャナー</h1>
      <p class="setup-sub">2つのキーを設定するだけで、レシートをスキャンするだけでスプレッドシートへ自動入力できます。</p>

      <div class="field">
        <label for="gkeyInp">Gemini API キー</label>
        <input type="password" id="gkeyInp" placeholder="AIza..." value="${esc(S.geminiKey)}" autocomplete="off" inputmode="text">
        <p class="field-hint">
          <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
          で無料取得。1日1,500回まで無料で使えます。
        </p>
      </div>

      <div class="field">
        <label for="urlInp">Apps Script Web App URL</label>
        <input type="url" id="urlInp" placeholder="https://script.google.com/macros/s/..." value="${esc(S.scriptUrl)}" autocomplete="off">
        <p class="field-hint">スプレッドシートのApps ScriptでデプロイしたウェブアプリのURL</p>
      </div>

      ${S.err ? `<p class="err-msg"><i class="ti ti-alert-circle"></i>${esc(S.err)}</p>` : ''}

      <button class="btn-primary" id="saveBtn" style="margin-top:10px">
        <i class="ti ti-check"></i> 設定を保存して始める
      </button>
    </div>
  </div>`;

  document.getElementById('saveBtn').addEventListener('click', () => {
    const key = document.getElementById('gkeyInp').value.trim();
    const url  = document.getElementById('urlInp').value.trim();
    if (!key) { S.err = 'Gemini APIキーを入力してください'; render(); return; }
    if (!url.startsWith('https://')) { S.err = 'Apps Script URLを入力してください'; render(); return; }
    save('kb_gkey', key); save('kb_url', url);
    S.geminiKey = key; S.scriptUrl = url; S.err = ''; S.screen = 'home'; render();
  });
}

function renderHome() {
  app.innerHTML = `<div class="screen">
    <div class="top-bar">
      <span class="app-name"><i class="ti ti-receipt-2"></i> 家計簿スキャナー</span>
      <button class="icon-btn" id="settBtn" aria-label="設定"><i class="ti ti-settings"></i></button>
    </div>

    <div class="scan-area">
      <button class="scan-btn" id="scanBtn" aria-label="レシートを撮影">
        <i class="ti ti-camera-plus s-icon"></i>
        <span class="s-label">レシートを撮影</span>
        <span class="s-sub">または画像を選択</span>
      </button>
    </div>

    <div class="stats-card">
      <span class="stats-num">${S.sent}</span>
      <span class="stats-lbl">件　累計記録済み</span>
    </div>

    ${S.err ? `<div class="err-banner"><i class="ti ti-alert-circle"></i><span>${esc(S.err)}</span></div>` : ''}

    <div class="gemini-tag"><i class="ti ti-sparkles"></i> Powered by Gemini Flash（無料枠）</div>
  </div>`;

  document.getElementById('scanBtn').addEventListener('click', () => fi.click());
  document.getElementById('settBtn').addEventListener('click', () => { S.screen = 'setup'; S.err = ''; render(); });
}

function renderProcessing() {
  app.innerHTML = `<div class="screen center">
    <div class="proc-icon"><i class="ti ti-brain"></i></div>
    <p class="proc-txt">Geminiがレシートを解析中...</p>
    <p class="proc-sub">カテゴリも自動で判定します</p>
  </div>`;
}

function entryHtml(e, i) {
  const po = CP.map(c => `<option value="${c}"${c===e.category?' selected':''}>${c}</option>`).join('');
  const bo = CB.map(c => `<option value="${c}"${c===e.category?' selected':''}>${c}</option>`).join('');
  return `<div class="entry-card">
    <div class="entry-head">
      <input type="date" data-f="date" data-i="${i}" value="${toDI(e.date)}" aria-label="日付">
      <button class="del-btn" data-i="${i}" aria-label="削除"><i class="ti ti-trash"></i></button>
    </div>
    <input type="text"   class="name-inp"  data-f="name"     data-i="${i}" placeholder="店舗名・品目" value="${esc(e.name)}" autocomplete="off">
    <div class="amt-row">
      <span class="yen-sign">¥</span>
      <input type="number" class="amt-inp" data-f="amount"   data-i="${i}" value="${e.amount||0}" min="0" step="1" inputmode="numeric">
    </div>
    <select class="cat-sel" data-f="category" data-i="${i}">
      <optgroup label="プライベート">${po}</optgroup>
      <optgroup label="ビジネス">${bo}</optgroup>
    </select>
    <input type="text" class="notes-inp" data-f="notes" data-i="${i}" placeholder="備考（任意）" value="${esc(e.notes||'')}" autocomplete="off">
  </div>`;
}

function syncDOM() {
  document.querySelectorAll('[data-f][data-i]').forEach(el => {
    const i = parseInt(el.dataset.i), f = el.dataset.f;
    if (isNaN(i) || !S.entries[i]) return;
    let v = el.value;
    if (f === 'date')   v = frDI(v);
    if (f === 'amount') v = Number(v) || 0;
    S.entries[i][f] = v;
  });
}

function updTotals() {
  const t = S.entries.reduce((s,e) => s + Number(e.amount||0), 0);
  const ta = document.getElementById('totalAmt');
  const cb = document.getElementById('cntBadge');
  if (ta) ta.textContent = `¥${fmt(t)}`;
  if (cb) cb.textContent = `${S.entries.length}件`;
}

function renderReview() {
  const total = S.entries.reduce((s,e) => s + Number(e.amount||0), 0);
  app.innerHTML = `<div class="screen">
    <div class="top-bar">
      <button class="icon-btn" id="backBtn" aria-label="戻る"><i class="ti ti-arrow-left"></i></button>
      <span class="title">確認・修正</span>
      <span class="badge" id="cntBadge">${S.entries.length}件</span>
    </div>

    <div id="eList" class="entries-list">${S.entries.map((e,i) => entryHtml(e,i)).join('')}</div>

    <button class="add-entry-btn" id="addBtn"><i class="ti ti-plus"></i> 明細を追加</button>

    <div class="submit-footer">
      <div class="total-row">
        <span>合計金額</span>
        <span class="total-amt" id="totalAmt">¥${fmt(total)}</span>
      </div>
      <div id="errSlot"></div>
      <button class="btn-primary" id="subBtn">
        <i class="ti ti-cloud-upload"></i> スプレッドシートに送信
      </button>
    </div>
  </div>`;

  document.getElementById('backBtn').addEventListener('click', () => { S.screen = 'home'; S.err = ''; render(); });

  document.getElementById('addBtn').addEventListener('click', () => {
    syncDOM();
    S.entries.push({ date:td(), name:'', amount:0, category:'P_食費', notes:'' });
    document.getElementById('eList').innerHTML = S.entries.map((e,i) => entryHtml(e,i)).join('');
    updTotals();
    document.getElementById('eList').lastElementChild?.scrollIntoView({ behavior:'smooth', block:'center' });
  });

  document.getElementById('subBtn').addEventListener('click', doSubmit);

  const list = document.getElementById('eList');

  list.addEventListener('change', ev => {
    const el = ev.target, i = parseInt(el.dataset.i), f = el.dataset.f;
    if (isNaN(i) || !f) return;
    let v = el.value;
    if (f === 'date')   v = frDI(v);
    if (f === 'amount') v = Number(v) || 0;
    S.entries[i][f] = v;
    if (f === 'amount') updTotals();
  });

  list.addEventListener('input', ev => {
    const el = ev.target, i = parseInt(el.dataset.i), f = el.dataset.f;
    if (isNaN(i) || !f || f === 'date' || f === 'amount' || f === 'category') return;
    S.entries[i][f] = el.value;
  });

  list.addEventListener('click', ev => {
    const btn = ev.target.closest('.del-btn');
    if (!btn) return;
    syncDOM();
    S.entries.splice(parseInt(btn.dataset.i), 1);
    document.getElementById('eList').innerHTML = S.entries.map((e,i) => entryHtml(e,i)).join('');
    updTotals();
  });
}

async function doSubmit() {
  const btn = document.getElementById('subBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2 ti-spin"></i> 送信中...';
  syncDOM();
  try {
    for (const e of S.entries) {
      await fetch(S.scriptUrl, {
        method: 'POST',
        body: new URLSearchParams({ date:e.date, name:e.name, amount:String(e.amount), category:e.category, notes:e.notes||'' })
      });
    }
    const n = S.entries.length;
    S.sent += n; S.lastN = n;
    save('kb_cnt', String(S.sent));
    S.entries = []; S.screen = 'success'; render();
  } catch {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-cloud-upload"></i> スプレッドシートに送信';
    document.getElementById('errSlot').innerHTML = `<div class="err-banner" style="margin:0 0 10px"><i class="ti ti-alert-circle"></i><span>送信エラー。URLを設定画面で確認してください。</span></div>`;
  }
}

function renderSuccess() {
  app.innerHTML = `<div class="screen center">
    <div class="ok-icon"><i class="ti ti-circle-check"></i></div>
    <p class="ok-txt">${S.lastN}件を記録しました</p>
    <p class="ok-sub">スプレッドシートに追加されました</p>
    <button class="btn-primary" id="contBtn" style="max-width:240px">
      <i class="ti ti-camera-plus"></i> 続けてスキャン
    </button>
    <a href="https://docs.google.com/spreadsheets/d/1fVvrcUDuarnCoFXQ3OsXLTmndHdLXri8bK8MGwFzm4s/edit"
       class="sheet-link" target="_blank">
      スプレッドシートを確認 <i class="ti ti-external-link"></i>
    </a>
  </div>`;
  document.getElementById('contBtn').addEventListener('click', () => { S.screen = 'home'; S.err = ''; render(); });
}

// ── Gemini API ────────────────────────────────────────────────────────────────
async function analyzeWithGemini(b64, mime) {
  const today = td();
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${S.geminiKey}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: SYS + `\n今日の日付: ${today}` }] },
      contents: [{ parts: [
        { inline_data: { mime_type: mime, data: b64 } },
        { text: 'このレシートから支出データを抽出してください。' }
      ]}],
      generationConfig: { maxOutputTokens: 1000 }
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const txt = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  return JSON.parse(txt.replace(/```json|```/g,'').trim());
}

// ── File input ────────────────────────────────────────────────────────────────
fi.addEventListener('change', async ev => {
  const file = ev.target.files?.[0];
  if (!file) return;
  ev.target.value = '';
  S.screen = 'processing'; S.err = ''; render();
  try {
    const { b64, mime } = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = e => res({ b64: e.target.result.split(',')[1], mime: file.type || 'image/jpeg' });
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    const parsed = await analyzeWithGemini(b64, mime);
    const today = td();
    S.entries = (parsed.entries || []).map(e => ({
      date:     e.date     || today,
      name:     e.name     || '',
      amount:   Number(e.amount) || 0,
      category: e.category || 'P_食費',
      notes:    e.notes    || ''
    }));
    if (!S.entries.length) S.entries = [{ date:today, name:'', amount:0, category:'P_食費', notes:'' }];
    S.screen = 'review';
  } catch (e) {
    S.err = `読み取りエラー: ${e.message || 'もう一度お試しください'}`;
    S.screen = 'home';
  }
  render();
});

// ── Boot ──────────────────────────────────────────────────────────────────────
init();
</script>
